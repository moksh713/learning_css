<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>

            .container{
                position: relative;
                margin: 50px;
            }
            div{
                width: 150px;
                height: 150px;
                border-radius: 50%;
                position: absolute;
            }
            .blue{
                background-color: blue;
                left: 40px;
            }
            .red{
                background-color: red;
                left: 80px;
            }
            .green{
                background-color: green;
                left: 120px;
            }
            /* larger z-index appears above smaller z-index */
            .blue1{
                background-color: blue;
                left: 40px;
                z-index: 3;
            }
            .red1{
                background-color: red;
                left: 80px;
                z-index: 2;
            }
            .green1{
                background-color: green;
                left: 120px;
                z-index: 1;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="blue"></div>
            <div class="red"></div>
            <div class="green"></div>
            <br><br><br><br><br><br><br><br><br><br>
            <div class="blue1"></div>
            <div class="red1"></div>
            <div class="green1"></div>
        </div>
    </body>
</html>
