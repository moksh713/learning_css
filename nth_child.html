<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css" type="text/css"/>
</head>
<style>
    ul{
        width: 300px;
        padding: 20px;
        margin: 50px;
        list-style-type: none;
        font-weight: 900;
        color: white;
    }
    li{
        background-color: black;
        padding: 50px;
        border: 5px solid green  ;
        border-radius: 30px;
        color: white;
    }
    li:nth-child(even){
        background-color: black;
        color: white;
    }
    li:nth-child(odd){
        background-color: red;
        color: white;
    }
    li:first-child{
        background-color: skyblue;
    }
    li:last-child{
        background-color: skyblue;
    }
    li:nth-child(5){
        background-color: green;
    }
</style>
<body>
    <ul>
        <li>item 1</li>
        <li>item 3</li>
        <li>item 2</li>
        <li>item 4</li>
        <li>item 5</li>
        <li>item 6</li>
        <li>item 7</li>
        <li>item 8</li>
        <li>item 9</li>
        <li>item 10</li>
    </ul>

</body>
</html>
